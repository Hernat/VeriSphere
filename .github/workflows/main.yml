# Main workflow — Story 1.3 (AR10 / D5.7).
# Triggers on every push to `main` (post-merge or direct push). Mirrors
# `pr.yml`'s lint + unit-tests + assemble-debug, then adds the Detekt
# step that hard-fails on any architecture-pattern violation.
#
# Detekt runs on `main` only by default — pre-merge it is the contributor's
# responsibility (PR template's Test plan recommends `./gradlew :app:detekt`
# locally before opening a PR). Post-merge Detekt on `main` ensures
# violations cannot accumulate undetected even if a contributor forgets.

name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize main-branch runs without cancelling. Two rapid pushes (fix-on-fix)
# both run to completion so build history is preserved, but they don't race
# on the Gradle cache write.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Lint
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:lintDebug

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:testDebugUnitTest

  assemble-debug:
    name: assemble-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:assembleDebug

  detekt:
    name: detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Detekt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:detekt
