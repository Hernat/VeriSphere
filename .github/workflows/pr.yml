# PR workflow — Story 1.3 (AR10 / D5.7).
# Triggers on every PR against `main`. Three named jobs (lint, unit-tests,
# assemble-debug) so each becomes its own status check; branch protection
# on `main` requires all three to pass before merge.
#
# `GEMINI_API_KEY` is needed at build time because Story 1.1's
# `app/build.gradle.kts` fail-fast logic rejects builds when the key is
# absent (D2.2). Set the GitHub Secret before this workflow runs.
#
# Forks are NOT supported in V1: GitHub Actions does not pass repository
# secrets to fork PR runs. Open PRs from branches on this repo only.

name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # `github.head_ref` is empty on non-`pull_request` events. If a future
  # story adds `workflow_dispatch:` here, fall back to `github.ref` so two
  # dispatched runs don't both collapse into a single `pr-` group.
  group: pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation-action@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run Android Lint
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:lintDebug

  version-info-guard:
    # Story 7.3 — fails the PR when version-info.json still ships the
    # PLACEHOLDER_PRE_V1 downloadUrl AND latestVersion has been bumped
    # beyond the 0.1.0 seed. Closes deferred-work F10 from Story 6.1
    # review. Required as a branch-protection status check on `main`
    # (see RELEASING.md → Branch protection on main).
    name: version-info-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation-action@v3
      - name: Verify version-info.json placeholder state
        shell: bash
        run: |
          set -euo pipefail
          # Story 7.3 code-review F11: `jq -e` errors on missing / null keys
          # (vs `jq -r` which would return the literal string "null" and
          # silently fall through the placeholder check).
          VINFO_VERSION=$(jq -er '.latestVersion' version-info.json) || {
            echo "::error::version-info.json: 'latestVersion' field is missing or null."
            exit 1
          }
          URL=$(jq -er '.downloadUrl' version-info.json) || {
            echo "::error::version-info.json: 'downloadUrl' field is missing or null."
            exit 1
          }
          # Story 7.3 code-review F2: strip trailing \r so Windows-CRLF
          # version.properties parses cleanly (sub() applied per match
          # block before assigning M/m/p).
          # Story 7.3 code-review F15: validate numeric MAJOR / MINOR /
          # PATCH in shell against the joined output rather than awk's
          # implicit `printf "%d"` coercion (which would turn "foo" into
          # 0 silently and produce a misleading PLACEHOLDER error).
          VPROPS_VERSION=$(awk -F= '
            /^MAJOR=/ { sub(/\r$/, "", $2); M=$2 }
            /^MINOR=/ { sub(/\r$/, "", $2); m=$2 }
            /^PATCH=/ { sub(/\r$/, "", $2); p=$2 }
            END { print M "." m "." p }
          ' version.properties)
          if ! [[ "$VPROPS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.properties produced non-numeric version string: '${VPROPS_VERSION}'. Each of MAJOR / MINOR / PATCH must be a non-negative integer."
            exit 1
          fi
          echo "version-info.latestVersion=${VINFO_VERSION}; version.properties=${VPROPS_VERSION}"
          # Story 7.3 code-review F3: PLACEHOLDER acceptance depends on
          # version-info.json.latestVersion ONLY (the 0.1.0 seed). Detaching
          # the gate from version.properties avoids the 0.1.0 → 0.1.1 bump
          # footgun where every PR would fail until the Drive upload + URL
          # bump landed.
          if [[ "$URL" == *"PLACEHOLDER"* ]]; then
            if [[ "$VINFO_VERSION" == "0.1.0" ]]; then
              echo "OK — placeholder downloadUrl accepted while version-info.json.latestVersion stays at the 0.1.0 seed (pre-first-signed-release state)."
            else
              echo "::error::version-info.json still contains 'PLACEHOLDER' but latestVersion=${VINFO_VERSION} has been bumped beyond the 0.1.0 seed. Replace downloadUrl with the real Drive share link before merging (see RELEASING.md step 6 + 7)."
              exit 1
            fi
          else
            echo "OK — downloadUrl=${URL} (production state)."
          fi

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run unit tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:testDebugUnitTest

  assemble-debug:
    name: assemble-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Assemble debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:assembleDebug
