# PR workflow — Story 1.3 (AR10 / D5.7).
# Triggers on every PR against `main`. Three named jobs (lint, unit-tests,
# assemble-debug) so each becomes its own status check; branch protection
# on `main` requires all three to pass before merge.
#
# `GEMINI_API_KEY` is needed at build time because Story 1.1's
# `app/build.gradle.kts` fail-fast logic rejects builds when the key is
# absent (D2.2). Set the GitHub Secret before this workflow runs.
#
# Forks are NOT supported in V1: GitHub Actions does not pass repository
# secrets to fork PR runs. Open PRs from branches on this repo only.

name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # `github.head_ref` is empty on non-`pull_request` events. If a future
  # story adds `workflow_dispatch:` here, fall back to `github.ref` so two
  # dispatched runs don't both collapse into a single `pr-` group.
  group: pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run Android Lint
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:lintDebug

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run unit tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:testDebugUnitTest

  assemble-debug:
    name: assemble-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Assemble debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:assembleDebug
