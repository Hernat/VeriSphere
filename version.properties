# VeriSphere — single source of truth for the app version (architecture D5.11).
# Parsed by app/build.gradle.kts:
#   versionName = "$MAJOR.$MINOR.$PATCH"
#   versionCode = MAJOR * 10000 + MINOR * 100 + PATCH
#
# Pre-V1 Release Policy (D5.11):
# - Project starts at 0.1.0 (initial pre-V1 alpha).
# - Patches: 0.1.1, 0.1.2, ...
# - Small evolutions before V1 ship-gate: 0.2.0, 0.3.0, ...
# - 1.0.0 is reserved for the moment the founder substitution success criterion
#   (PRD Success Criteria #1) is validated for >= 1 week of personal usage.
#   DO NOT bump to 1.0.0 just because the codebase looks complete.
MAJOR=0
MINOR=2
PATCH=1
